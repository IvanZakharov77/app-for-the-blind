<body>
    <div class="wrapper">
        <div class="main">
            <a href="/" class="logo">
                <span>ВХОД</span>
            </a>
            <div class="content">
                <form id="check-form" class="check-form" method="post" action="/ajax/login/">
                    <div class="check-title">Вход</div>
                    <div class="check-group">
                        <input type="text" class="check-input" id="login_name" name="login_name" placeholder="Email">
                    </div>
                    <br />
                    <div class="check-group">
                        <input type="password" class="check-input" id="login_password" name="login_password" placeholder="Пароль">
                        <button type="submit" class="check-submit">Войти</button>
                    </div>
                    <input name="login_not_save" type="hidden" id="login_not_save" value="0">
                    <input name="login" type="hidden" id="login" value="submit">
                </form>

                <div id="check-result" class="check-result" style="display: none;">
                    <ul class="result-text" style="color: #b12828;"></ul>
                </div>

                <div class="actions-holder">
                    <a href="/registration/">Создать аккаунт</a> или <a href="/lost/">восстановить пароль</a>
                </div>
            </div>
        </div>
        <div class="footer">

            </div>

                <a href="/cartoons/">Мультфильмы</a>
                <a href="/animation/">Аниме</a>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var sendajax = function (url, params, callback, more) {
                more = more || {};
                params = params || {};

                var ajaxOptions = {
                    type: more.type || 'POST',
                    url: url,
                    data: params,
                    dataType: more.dataType || 'json',
                    success: callback || function (msg) {}.bind(this),
                    error: more.error || function (msg) {}.bind(this),
                    complete: more.complete || function (msg) {}.bind(this)
                };

                return $.ajax(ajaxOptions);
            };

            $('#check-form').on('submit', function (e) {
                e.preventDefault();

                var _self = $(this),
                    _fields = $('.check-input', _self),
                    _loader = _self.find('.check-submit');

                if (!_loader.hasClass('__loading')) {
                    _loader.addClass('__loading');

                    $('#check-result-none').hide();
                    $('#check-result').hide();
                    $('#check-result .result-text').empty();

                    try {
                        sendajax('/ajax/login/', {login_name: $.trim($('#login_name').val()), login_password: $.trim($('#login_password').val()), login_not_save: '0'}, function (response) {
                            if (response.success == true) {
                                setTimeout(function () {
                                    window.location.replace("/");
                                }, 100);
                            } else {
                                _loader.removeClass('__loading');

                                $('#check-result .result-text').html('<li>'+ response.message +'</li>').show();
                                $('#check-result').show();
                            }
                        });
                    } catch(e) {};
                }
            });
        })();
    </script>
