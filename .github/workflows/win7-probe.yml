name: Win7 import probe
on:
  push:
    branches: [win7-probe]
jobs:
  piper-x86:
    uses: ./.github/workflows/piper-x86.yml
  scan:
    needs: [piper-x86]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: piper32
          path: piper32
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Imports of every binary (system DLLs only)
        shell: pwsh
        run: |
          python -m pip install -q pefile
          Invoke-WebRequest -UseBasicParsing https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip -OutFile p64.zip
          Expand-Archive p64.zip p64
          $code = @"
          import pefile, pathlib, sys
          own = set()
          for root in sys.argv[1:]:
              own |= {p.name.lower() for p in pathlib.Path(root).rglob('*.dll')}
          for root in sys.argv[1:]:
              found = {}
              for path in sorted(pathlib.Path(root).rglob('*')):
                  if path.suffix.lower() not in ('.dll', '.exe'):
                      continue
                  pe = pefile.PE(str(path))
                  for attr in ('DIRECTORY_ENTRY_IMPORT', 'DIRECTORY_ENTRY_DELAY_IMPORT'):
                      for entry in getattr(pe, attr, []):
                          dll = entry.dll.decode().lower()
                          if dll in own or dll.startswith('api-ms-win-crt'):
                              continue
                          for imp in entry.imports:
                              name = imp.name.decode() if imp.name else '#%d' % imp.ordinal
                              found.setdefault(dll + '!' + name, set()).add(path.name + ('(delay)' if 'DELAY' in attr else ''))
              print('=====', root, len(found))
              for key in sorted(found):
                  print(key, ' <- ', ','.join(sorted(found[key])))
          "@
          python -c $code piper32 p64
