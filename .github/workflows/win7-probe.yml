name: Win7 import probe
on:
  push:
    branches: [win7-probe]
jobs:
  shim:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build vega7.dll against the official onnxruntime and run its checks
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          python -m pip install -q pefile
          $name = "onnxruntime-win-${{ matrix.arch }}-1.14.1"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v1.14.1/$name.zip" -OutFile ort.zip
          Expand-Archive ort.zip .
          python tools\win7_shim.py "$name\lib" ${{ matrix.arch }}
          if ($LASTEXITCODE) { throw "shim" }
          python tools\win7_shim.py --check "$name\lib"
          python -c "import pefile;pe=pefile.PE(r'$name\lib\vega7.dll');print([ (e.name, e.forwarder) for e in pe.DIRECTORY_ENTRY_EXPORT.symbols][:8]);print([i.dll for i in getattr(pe,'DIRECTORY_ENTRY_IMPORT',[])])"
