name: Build Vega-Setup.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64

      - name: Build installer (build-windows.cmd)
        shell: cmd
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%PATH%"
          if not exist tools mkdir tools
          rem Point the script at the runner's Python 3.8 instead of downloading one.
          mklink /J tools\python38 "%pythonLocation%" 2>nul || xcopy /E /I /Q "%pythonLocation%" tools\python38
          set PYTHONIOENCODING=utf-8
          call build-windows.cmd > build.log 2>&1
          set RC=%errorlevel%
          type build.log
          if not "%RC%"=="0" python -c "import io;a=io.open('build.log',encoding='cp866',errors='replace').read().splitlines();t=[l for l in a if l.startswith(('ERROR:','FAIL:','Ran ','FAILED'))]+['----']+a[-60:];print('::error title=build-windows.cmd failed::'+'%%0A'.join(l.replace('%%','%%25') for l in t))"
          exit /b %RC%

      - name: Smoke-run voice mode (diagnostics only)
        continue-on-error: true
        shell: pwsh
        run: |
          $app = "dist\VoiceAssistSetup"
          if (Test-Path third_party\piper) { Copy-Item -Recurse -Force third_party\piper "$app\piper" }
          $p = Start-Process -FilePath "$app\VoiceAssistSetup.exe" -ArgumentList '--voice','--model','third_party\vosk-model-small-ru-0.22' `
            -RedirectStandardOutput voice-out.txt -RedirectStandardError voice-err.txt -PassThru
          Start-Sleep -Seconds 150
          if (-not $p.HasExited) { "still running after 150 s"; Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)" }
          $log = Join-Path $env:APPDATA "VoiceAssist\last-error.log"
          $text = "stdout:`n" + (Get-Content -Raw -Encoding UTF8 voice-out.txt) + "`nstderr:`n" + (Get-Content -Raw -Encoding UTF8 voice-err.txt)
          if (Test-Path $log) { $text += "`nlast-error.log:`n" + (Get-Content -Raw -Encoding UTF8 $log) }
          $text
          $lines = ($text -split "`r?`n" | Select-Object -Last 60) -join '%0A'
          Write-Output "::warning title=voice smoke run::$lines"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Setup
          path: installer/Output/Vega-Setup.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(python -c 'import voiceassist; print(voiceassist.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vega ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Скачайте Vega-Setup.exe и запустите его на компьютере с Windows 7 SP1, 10 или 11 (64-бит).
            Подробности в ИНСТРУКЦИЯ.md.
          files: installer/Output/Vega-Setup.exe
          overwrite_files: true
