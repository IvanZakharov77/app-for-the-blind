name: Build Vega-Setup.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64

      - name: Build installer (build-windows.cmd)
        shell: cmd
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%PATH%"
          if not exist tools mkdir tools
          rem Point the script at the runner's Python 3.8 instead of downloading one.
          mklink /J tools\python38 "%pythonLocation%" 2>nul || xcopy /E /I /Q "%pythonLocation%" tools\python38
          set PYTHONIOENCODING=utf-8
          call build-windows.cmd > build.log 2>&1
          set RC=%errorlevel%
          type build.log
          if not "%RC%"=="0" python -c "import io;a=io.open('build.log',encoding='cp866',errors='replace').read().splitlines();t=[l for l in a if l.startswith(('ERROR:','FAIL:','Ran ','FAILED'))]+['----']+a[-60:];print('::error title=build-windows.cmd failed::'+'%%0A'.join(l.replace('%%','%%25') for l in t))"
          exit /b %RC%

      - name: Smoke-run voice mode (diagnostics only)
        continue-on-error: true
        shell: pwsh
        run: |
          $app = "dist\VoiceAssistSetup"
          if (Test-Path third_party\piper) { Copy-Item -Recurse -Force third_party\piper "$app\piper" }
          $p = Start-Process -FilePath "$app\VoiceAssistSetup.exe" -ArgumentList '--voice','--model','third_party\vosk-model-small-ru-0.22' `
            -RedirectStandardOutput voice-out.txt -RedirectStandardError voice-err.txt -PassThru
          Start-Sleep -Seconds 150
          if (-not $p.HasExited) { "still running after 150 s"; Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)" }
          $log = Join-Path $env:APPDATA "VoiceAssist\last-error.log"
          $text = "stdout:`n" + (Get-Content -Raw -Encoding UTF8 voice-out.txt) + "`nstderr:`n" + (Get-Content -Raw -Encoding UTF8 voice-err.txt)
          if (Test-Path $log) { $text += "`nlast-error.log:`n" + (Get-Content -Raw -Encoding UTF8 $log) }
          $text
          $lines = ($text -split "`r?`n" | Select-Object -Last 60) -join '%0A'
          Write-Output "::warning title=voice smoke run::$lines"

      - name: Vosk model under a Cyrillic folder (diagnostics only)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Пользователь"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse -Force third_party\vosk-model-small-ru-0.22 (Join-Path $dir "model")
          $env:VEGA_MODEL = Join-Path $dir "model"
          $env:PYTHONIOENCODING = "utf-8"
          $code = @"
          import os
          from pathlib import Path
          from vosk import Model, SetLogLevel
          from voiceassist.model_path import latin_model_path
          SetLogLevel(-1)
          path = Path(os.environ['VEGA_MODEL'])
          try:
              Model(str(path)); print('raw cyrillic path: loaded')
          except Exception as error:
              print('raw cyrillic path: FAILED', type(error).__name__, error)
          fixed = latin_model_path(path)
          Model(str(fixed)); print('latin path', fixed, ': loaded')
          "@
          $out = (.venv\Scripts\python.exe -c $code 2>&1 | Out-String)
          $out
          Write-Output ("::warning title=vosk cyrillic path::" + ($out -replace "`r?`n", '%0A'))

      - name: Piper and the command grammar under a Cyrillic profile (diagnostics only)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Пользователь\Temp"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          $code = @"
          import json, os, subprocess, tempfile
          from pathlib import Path
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          piper = Path('third_party/piper/piper.exe').resolve()
          model = Path('third_party/piper/ru_RU-irina-medium.onnx').resolve()
          print('piper dlls:', ' '.join(sorted(p.name for p in piper.parent.glob('*.dll'))))
          raw = Path(os.environ['CYR_TEMP']) / 'raw.wav'
          line = json.dumps({'text': 'Проверка.', 'output_file': str(raw)}, ensure_ascii=False) + '\n'
          try:
              subprocess.run([str(piper), '--model', str(model), '--json-input', '--quiet'], input=line.encode('utf-8'),
                             capture_output=True, timeout=120, cwd=str(piper.parent))
          except Exception as error:
              print('piper raw run error', error)
          print('piper, cyrillic output file:', 'written' if raw.is_file() else 'NOT written')
          os.environ['TEMP'] = os.environ['TMP'] = os.environ['CYR_TEMP']
          tempfile.tempdir = None
          from voiceassist.piper_voice import PiperSpeaker
          class Mute:
              def play(self, path, wait=True): pass
              def stop(self): pass
          try:
              speaker = PiperSpeaker(piper, model, player=Mute())
              print('PiperSpeaker with cyrillic TEMP: ok, sound folder', speaker.folder)
          except Exception as error:
              print('PiperSpeaker with cyrillic TEMP: FAILED', type(error).__name__, error)
          from voiceassist.understanding import grammar_phrases
          from voiceassist.browser import BUILTIN_SITES
          sites = [name for names, _url in BUILTIN_SITES for name in names]
          rec = KaldiRecognizer(Model('third_party/vosk-model-small-ru-0.22'), 16000,
                                json.dumps(grammar_phrases(sites) + ['[unk]'], ensure_ascii=False))
          rec.AcceptWaveform(b'\0' * 32000)
          print('command grammar recognizer: ok,', len(grammar_phrases(sites)), 'phrases', rec.FinalResult().replace(chr(10), ' '))
          from voiceassist.youtube_search import search
          videos = search('песни высоцкого')
          print('youtube without extension:', 'unreachable' if videos is None else '{} videos'.format(len(videos)),
                '; '.join(video['name'] for video in (videos or [])[:3]))
          from voiceassist import film_sites
          for key in ('kinokrad', 'rezka', 'filmix'):
              films = film_sites.search(key, 'человек паук')
              print('film search', key + ':', 'unreachable' if films is None else '{} films'.format(len(films)),
                    '; '.join(film['name'] for film in (films or [])[:2]))
          from voiceassist.gemini import GeminiHelper
          logged = []
          print('gemini with a fake key:', GeminiHelper('AIzaFAKE', ['который час'], log=logged.append).understand(b'', ''), logged[-1:] or '')
          for url in ('https://kinokrad.my/s27', 'https://hdrezka.la/', 'https://filmix.gg/film/t8/pages/2/'):
              films = film_sites.films_on(url)
              print('films on', url + ':', 'unreachable' if films is None else '{} films'.format(len(films)))
          from voiceassist import net
          from urllib.request import Request, build_opener
          for host in ('kinokrad.my', 'generativelanguage.googleapis.com'):
              address = net.resolve(host)
              try:
                  with build_opener(net._PinnedHandler(context=net.context())).open(Request('https://' + host + '/', headers={'User-Agent': 'Mozilla/5.0'}), timeout=15) as r:
                      print('pinned', host, address, r.status)
              except Exception as error:
                  print('pinned', host, address, 'error', getattr(error, 'code', ''), error)
          from voiceassist.diagnostics import CHECKED_SITES
          print('\n'.join(net.check(CHECKED_SITES)))
          from voiceassist.page_reader import read_page, chunk
          for url in ('https://ru.wikipedia.org/wiki/%D0%A1%D0%BE%D0%BB%D1%8F%D1%80%D0%B8%D1%81_(%D1%80%D0%BE%D0%BC%D0%B0%D0%BD)',
                      'https://sinoptik.ua/', 'https://www.ukr.net/', 'https://kinokrad.my/s27'):
              page = read_page(url)
              print('page', url[:40] + ':', 'unreachable' if page is None else '{!r}, {} headings: {}; text {} chars: {}'.format(
                  page.title[:60], len(page.headings), '; '.join(page.headings[:3])[:120], len(page.text), chunk(page.text, 0)[0][:160]))
          "@
          $env:CYR_TEMP = $dir
          $out = (.venv\Scripts\python.exe -c $code 2>$null | Out-String)
          $out
          Write-Output ("::warning title=piper and grammar::" + ($out -replace "`r?`n", '%0A'))

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Setup
          path: installer/Output/Vega-Setup.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(python -c 'import voiceassist; print(voiceassist.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vega ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Vega-Setup.exe — для 64-разрядной Windows 7 SP1, 8, 10, 11.
            Vega-Setup-32bit.exe — для 32-разрядной Windows 7 SP1 и новее (без голоса Piper).
            Подробности в ИНСТРУКЦИЯ.md.
          files: installer/Output/Vega-Setup.exe
          overwrite_files: true

  # Ivan, 2026-10-27: 32-bit Windows 7 must work too. Same build script, x86 Python, no Piper.
  build-x86:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.8 x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Build 32-bit installer (build-windows.cmd)
        shell: cmd
        env:
          VEGA_ARCH: x86
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%PATH%"
          if not exist tools mkdir tools
          mklink /J tools\python38 "%pythonLocation%" 2>nul || xcopy /E /I /Q "%pythonLocation%" tools\python38
          set PYTHONIOENCODING=utf-8
          call build-windows.cmd > build.log 2>&1
          set RC=%errorlevel%
          type build.log
          if not "%RC%"=="0" python -c "import io;a=io.open('build.log',encoding='cp866',errors='replace').read().splitlines();t=[l for l in a if l.startswith(('ERROR:','FAIL:','Ran ','FAILED'))]+['----']+a[-60:];print('::error title=32-bit build failed::'+'%%0A'.join(l.replace('%%','%%25') for l in t))"
          exit /b %RC%

      - name: Check the 32-bit program starts
        shell: cmd
        run: |
          dist\VoiceAssistSetup\VoiceAssistSetup.exe --help
          python -c "import struct;print('python bits', struct.calcsize('P')*8)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Setup-32bit
          path: installer/Output/Vega-Setup-32bit.exe
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(python -c 'import voiceassist; print(voiceassist.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: installer/Output/Vega-Setup-32bit.exe
          overwrite_files: true
